<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Matsutake Go">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a866"/>
      <stop offset="1" stop-color="#a86a34"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2e3cd"/>
      <stop offset="1" stop-color="#cbb290"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#0e1512"/>
    <!-- heath contour lines: the sloping ground the mushroom wants -->
    <g fill="none" stroke="#4ade80" stroke-opacity=".18" stroke-width="10" stroke-linecap="round">
      <path d="M-20 388 C 90 344 170 396 250 372 C 340 344 430 392 532 356"/>
      <path d="M-20 448 C 100 404 180 456 260 432 C 350 404 440 452 532 416"/>
      <path d="M-20 328 C 80 292 150 336 226 316"/>
    </g>

    <!-- stem -->
    <path d="M214 250 h84 l-9 154 c-1.6 20-13 30-33 30 s-31.4-10-33-30 z" fill="url(#stem)"/>
    <!-- ring -->
    <path d="M206 262 h100 l-3 20 h-94 z" fill="#b99a72"/>
    <!-- cap -->
    <path d="M116 246 c0-84 54-140 140-140 s140 56 140 140 c0 16-14 24-36 24 h-208 c-22 0-36-8-36-24 z" fill="url(#cap)"/>
    <!-- cap scales -->
    <g fill="#f2e3cd" fill-opacity=".55">
      <ellipse cx="196" cy="176" rx="20" ry="12" transform="rotate(-22 196 176)"/>
      <ellipse cx="272" cy="152" rx="24" ry="13"/>
      <ellipse cx="330" cy="200" rx="19" ry="11" transform="rotate(24 330 200)"/>
      <ellipse cx="168" cy="226" rx="17" ry="10" transform="rotate(-10 168 226)"/>
      <ellipse cx="256" cy="216" rx="21" ry="11"/>
    </g>
  </g>
</svg>
